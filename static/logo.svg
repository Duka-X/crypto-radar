<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6d00" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ff6d00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6d00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blipCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffab00"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <rect width="256" height="256" rx="32" fill="#0d1117"/>

  <!-- Outer glow ring -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#00e5ff" stroke-opacity="0.04" stroke-width="12"/>

  <!-- Concentric radar rings -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="128" y1="30" x2="128" y2="226" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1.5"/>
  <line x1="30" y1="128" x2="226" y2="128" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Tick marks -->
  <line x1="128" y1="30" x2="128" y2="42" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="128" y1="226" x2="128" y2="214" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="30" y1="128" x2="42" y2="128" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="226" y1="128" x2="214" y2="128" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="78" y1="38" x2="84" y2="50" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="178" y1="38" x2="172" y2="50" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="38" y1="78" x2="50" y2="84" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="38" y1="178" x2="50" y2="172" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="78" y1="218" x2="84" y2="206" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="178" y1="218" x2="172" y2="206" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="218" y1="78" x2="206" y2="84" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="218" y1="178" x2="206" y2="172" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Sweep beam -->
  <path d="M 128 128 L 197 59 A 98 98 0 0 1 226 128 Z" fill="#00e5ff" fill-opacity="0.08"/>
  <path d="M 128 128 L 203 53 A 105 105 0 0 1 233 128 Z" fill="#00e5ff" fill-opacity="0.04"/>

  <!-- Sweep beam edge lines -->
  <line x1="128" y1="128" x2="197" y2="59" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="128" x2="226" y2="128" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === THE "CRAP" BLIP === -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="4s" repeatCount="indefinite"/>
    
    <!-- Pulse ring outer -->
    <circle cx="198" cy="58" r="14" fill="none" stroke="#ff6d00" stroke-opacity="0.15" stroke-width="2">
      <animate attributeName="r" values="14;24;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0;0.15" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Pulse ring inner -->
    <circle cx="198" cy="58" r="9" fill="none" stroke="#ffab00" stroke-opacity="0.2" stroke-width="1.5">
      <animate attributeName="r" values="9;17;9" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Blip glow -->
    <circle cx="198" cy="58" r="12" fill="url(#blipGlow)">
      <animate attributeName="r" values="12;16;12" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Blip core -->
    <circle cx="198" cy="58" r="5" fill="url(#blipCore)">
      <animate attributeName="r" values="5;6.5;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Crosshair dashed lines -->
    <line x1="198" y1="46" x2="198" y2="70" stroke="#ff6d00" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="186" y1="58" x2="210" y2="58" stroke="#ff6d00" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- "!" label above blip -->
    <text x="198" y="42" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="11" font-weight="700" fill="#ff6d00" text-anchor="middle">!</text>
  </g>

  <!-- Center dot -->
  <circle cx="128" cy="128" r="4" fill="#00e5ff" fill-opacity="0.5"/>
</svg>
