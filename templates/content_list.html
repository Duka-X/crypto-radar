<!DOCTYPE html>
<html lang="en"><head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-33MYYVE2Y4"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-33MYYVE2Y4");</script>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Articles — CryptoRadar</title>
<meta name="description" content="Educational articles about crypto signal scoring and rankings.">
<link rel=stylesheet href=/static/style.css>
<style>
.alist{max-width:640px;margin:0 auto;padding:24px 20px}
.alist h1{font-size:1.3rem;margin-bottom:1rem}
.alist .item{padding:12px 0;border-bottom:1px solid var(--border)}
.alist .item a{font-size:1rem;font-weight:600;color:var(--accent);text-decoration:none}
</style>
<link rel="canonical" href="https://cryptoradar.dev{{ request.url.path }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CryptoRadar">
    <meta property="og:url" content="https://cryptoradar.dev{{ request.url.path }}">
    <meta property="og:title" content="{{ page_title or 'CryptoRadar - Multi-Signal Crypto Ranking' }}">
    <meta property="og:description" content="{{ page_description or 'CryptoRadar ranks cryptocurrencies with multi-signal scoring: Trending, Price Action, Momentum, and Volume.' }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page_title or 'CryptoRadar - Multi-Signal Crypto Ranking' }}">
    <meta name="twitter:description" content="{{ page_description or 'CryptoRadar ranks cryptocurrencies with multi-signal scoring: Trending, Price Action, Momentum, and Volume.' }}">
</head><body>
<header class=header><div class=container><div class=header-top><a href=/ class=logo>CryptoRadar<span class=logo-dot>.</span></a></div></div></header>
<main class=alist><h1>Articles</h1>
{% for a in articles %}<div class=item><a href=/content/{{ a.slug }}>{{ a.title }}</a></div>{% endfor %}
{% if not articles %}<p style=color:var(--text-secondary)>No articles yet.</p>{% endif %}
</main>
<footer class=footer><div class=container><p><a href=/>Home</a></p></div></footer>
</body></html>
